services:
  capcut-mate-mcp:
    image: registry.cn-shenzhen.aliyuncs.com/jbang/capcut-mate-mcp:latest
    ports:
      - "30001:30000"
    env_file:
      - ./.env
    build:
      context: .
      dockerfile: MCP.Dockerfile
    volumes:
      - ./output:/app/output
      - /etc/localtime:/etc/localtime:ro  # 挂载主机时区
      - /etc/timezone:/etc/timezone:ro    # 挂载时区名称（可选）
    mem_limit: 2G     # 内存限制
    memswap_limit: 2G # 总内存（物理内存 + Swap）限制
    cpus: '2'       # CPU使用率限制为150%，即容器最多可以使用1.5个完整的CPU核心
    oom_score_adj: -500  # 调整 OOM 杀手优先级
    restart: unless-stopped  # 除非手动停止，否则总是重启容器
    container_name: capcut-mate-mcp # 这里指容器名称，非必需，不指定时，名称为：<项目名称>-<服务名称>-<序号>
  capcut-mate:
    image: registry.cn-shenzhen.aliyuncs.com/jbang/capcut-mate-mcp:latest
    ports:
      - "30000:30000"
    volumes:
      - ./output:/app/output
      - /etc/localtime:/etc/localtime:ro  # 挂载主机时区
      - /etc/timezone:/etc/timezone:ro    # 挂载时区名称（可选）
    mem_limit: 2G     # 内存限制
    memswap_limit: 2G # 总内存（物理内存 + Swap）限制
    cpus: '2'       # CPU使用率限制为150%，即容器最多可以使用1.5个完整的CPU核心
    oom_score_adj: -500  # 调整 OOM 杀手优先级
    restart: unless-stopped  # 除非手动停止，否则总是重启容器
    container_name: capcut-mate # 这里指容器名称，非必需，不指定时，名称为：<项目名称>-<服务名称>-<序号>
    entrypoint: ["uv", "run", "main.py", "--workers", "4"]
